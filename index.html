<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión</title>
  <link rel="stylesheet" href="styles.css">
  <script src="index.js"></script>
</head>
<body>
  <main class="tarjeta">
    <h1>Iniciar sesión</h1>
    
    <div class="campo">
      <label for="usuario">Usuario</label>
      <input type="text" id="usuario" autocomplete="username">
    </div>

    <div class="campo">
      <label for="contrasena">Contraseña</label>
      <input type="password" id="contrasena" autocomplete="current-password">
    </div>

    <div class="botones">
      <button type="button" id="btn-login">Iniciar sesión</button>
      <a href="#" class="olvide">Olvidé mi contraseña</a>
    </div>
  </main>
</body>
</html>
